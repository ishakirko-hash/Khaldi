<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="112" fill="#0F172A"/>
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#10B981" stroke-width="8" stroke-dasharray="16 8" opacity="0.3"/>
  
  <!-- Stylized Plastic Crate -->
  <g transform="translate(64, 80)">
    <!-- Main crate body -->
    <rect x="24" y="90" width="336" height="230" rx="24" fill="#047857"/>
    <rect x="36" y="102" width="312" height="206" rx="16" fill="#059669"/>
    
    <!-- Top rim -->
    <rect x="12" y="50" width="360" height="46" rx="12" fill="#10B981"/>
    
    <!-- Handle Cutout -->
    <rect x="132" y="120" width="120" height="34" rx="17" fill="#0F172A"/>
    
    <!-- Ventilation Grid Lines (standard vegetable crate pattern) -->
    <line x1="60" y1="180" x2="324" y2="180" stroke="#047857" stroke-width="8"/>
    <line x1="60" y1="220" x2="324" y2="220" stroke="#047857" stroke-width="8"/>
    <line x1="60" y1="260" x2="324" y2="260" stroke="#047857" stroke-width="8"/>
    
    <line x1="90" y1="160" x2="90" y2="290" stroke="#047857" stroke-width="8"/>
    <line x1="140" y1="160" x2="140" y2="290" stroke="#047857" stroke-width="8"/>
    <line x1="190" y1="160" x2="190" y2="290" stroke="#047857" stroke-width="8"/>
    <line x1="240" y1="160" x2="240" y2="290" stroke="#047857" stroke-width="8"/>
    <line x1="290" y1="160" x2="290" y2="290" stroke="#047857" stroke-width="8"/>
  </g>
  
  <!-- Text Brand -->
  <text x="256" y="440" font-family="'Cairo', sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">KHALDI PLAST</text>
</svg>
